name: pharmacypro
description: "PharmaChain - Pharmacy Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.8
  firebase_auth: ^5.5.4

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.1.2

  # Responsive
  flutter_screenutil: ^5.9.3

  # Serialization
  json_annotation: ^4.9.0

  # SVG
  flutter_svg: ^2.0.17

  # Utils
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  injectable_generator: ^2.7.0
  freezed: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
